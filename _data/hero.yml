current_promo: articles/hero-article.html
auth_promo: articles/hero-article.html

# Livestream
# Set true/false (lowercase).
# Note: true overrides current/auth promo heros
livestream: false

# Source
# Set twitch/youtube (lowercase)
# Note: As a fallback, the current promo displays if a typo/erroneous/null source value is set
embed_source: "youtube"

# Content
# Update per livestream, if needed
title: "Livestream"
short_description: "AI Reality Check: 2024 Year in Review"
byline: "with Jeremy Osborn and Andrew Miller"

# twitch
twitch_channel: "andrewpmiller"

# youtube
youtube_video_ID: "GTQcUE0NNfo"

# Aspect Ratio 16:19
embed_width: "854"
embed_height: "400"

# Options
embed_allowfullscreen: true
embed_auto_play: false
embed_fetchpriority: "high"
embed_loading: "eager"
embed_frameborder: "0"
embed_scrolling: "no"
