{% comment %}
Depends on a `course_list` array being passed in
{% endcomment %}
<script type="application/ld+json">
{
  "@context": "http://schema.org",
  "@type": "ItemList",
  "itemListElement": [
  {%- for num in course_list -%}
    {%- assign course_id = num | prepend: "GYM-" -%}
    {%- assign item = site.data.courses[course_id] -%}
    {%- assign link = item.url | prepend: "https://thegymnasium.com" -%}
    {%- assign bio = site.data.bios[item.instructor] -%}
    {%- assign img = num | prepend: "/img/social/courses/gym-" | append: "-social.png" %}
    {
      "@type": "ListItem",
      "position": {{ forloop.index }},
      "item": {
        "@type": "Course",
        "name": "{{ item.title }}",
        "description": "{{ item.short_description }}",
        "image": "{{ site.url }}{{ img }}",
        "url": "{{ link }}",
        "provider": {
          "@type": "School",
          "name": "Gymnasium",
          "sameAs": "https://thegymnasium.com"
        },
        "hasCourseInstance": {
          "@type": "CourseInstance",
          "courseMode": [
            "MOOC",
            "online"
          ],
          "offers": {
            "@type": "Offer",
            "price": "free"
          }
        }
      }
    }{%- unless forloop.last %},{% endunless %}
  {%- endfor %}
  ]
}
</script>
