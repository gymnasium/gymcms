# Setup
title: Gymnasium Static Content
url: http://localhost:4000
gymurl: https://courses.gymna.si
aqassetsurl: https://assets.aquent.com
timezone: America/New_York
environment: local
banner: true

# Building

exclude:
  - 'Dockerfile'
  - 'docker-compose.yml'
  - 'Gemfile'
  - 'Gemfile.lock'
  - 'README.md'
  - 'netlify.toml'
  - '.jekyll-cache'

include:
  - '_redirects'

repository: gymnasium/gymcms

# Conversion
markdown: kramdown
highlighter: rouge

# Markdown Processing
kramdown:
  auto_ids:       true
  entity_output:  as_char
  toc_levels:     1..6
  smart_quotes:   lsquo,rsquo,ldquo,rdquo
  input:          GFM
  hard_wrap:      false
  footnote_nr:    1
  show_warnings:  false

## CSS Preprocessing/SASS (see @https://github.com/jekyll/jekyll-sass-converter)
sass:
  sass_dir: _sass
  style: compressed

## Additional Plugins
plugins:
  - jekyll-get-json

## JSON Fetch
jekyll_get_json:
  - data: jobs
    json: 'https://aquentllc.wpengine.com/wp-json/aq-central/v1/gymnasium/listing'
  - data: markets
    json: 'https://aquentllc.wpengine.com/feeds/gymnasium-markets.json'
